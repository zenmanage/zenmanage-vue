# Keeps the npm dependencies and the GitHub Actions used by the workflows up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # CI still tests Node 18 and 20. Vitest 3 is the newest line that supports both
    # (vitest 4 needs Node 20+, vitest 5 needs Node 22+), so stay on it until those
    # Node versions are dropped from the test matrix.
    ignore:
      - dependency-name: 'vitest'
        versions: ['>=4.0.0']
      - dependency-name: '@vitest/*'
        versions: ['>=4.0.0']
      # jsdom 27+ needs Node 20.19+ (30 needs Node 22.22+); 26.1.0 is the newest that
      # still runs on Node 18. The smoke app below only runs on Node 22, so it is not held back.
      - dependency-name: 'jsdom'
        versions: ['>=27.0.0']

  # The smoke app runs the built package. The CI matrix installs the Vue versions it checks
  # (3.4, the oldest this package supports, and the latest) itself, so only security fixes and
  # its other dependencies need Dependabot.
  - package-ecosystem: 'npm'
    directory: '/examples/smoke-app'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'vue'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
